## AIC Mod 0.3.1
## 节名与键名保持 ASCII，中文注释仅作说明。

[General]

## 界面快捷键 / 进入游戏后自动显示界面
UiKey = F8
UiShowOnStart = false

## 危险度倍率（1 = 原版）
DangerMultiplier = 2

## 永夜
AlwaysNight = true

## 召唤追加数量倍率（1 = 原版）
EnemyCountMultiplier = 2

## 每场召唤额外追加的敌人数量
EnemyCountAdd = 0

## 是否把 %EN 脚本里写死的数量也乘上倍率，并放宽同屏上限
EnemyCountScaleScript = false

## 食物效果：最终值 = 起点 + 原值 x 倍率
FoodCapMultiplier = 1
FoodCapStart = 0

## 饱腹值上限（原版 28）
FoodCostMax = 999

## 杖强化总开关
CaneEnabled = true

## 以下为杖属性偏移量：原版值 + 本值，0 = 原版

near_power = 1
near_shotgun_power = 1
near_reach = 1
near_punch_speed = 1
magic_prepare_speed = 1
far_power = 1
lockon_power = 5

mp_use_ratio = 0
drain_after_lock = 0
mana_splash_ratio = 0
stability = 1
neutral = 1
castspeed = 1
castspeed_overhold = 1
